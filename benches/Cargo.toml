# The benchmarks and the profiler of oxirush-gtp-u. A package of its own,
# so that the crate keeps its dependencies: nothing here is published.
[package]
name = "oxirush-gtp-u-benches"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
oxirush-gtp-u = { path = "..", default-features = false, features = ["endpoint"] }
tokio = { version = "1.38", features = ["macros", "net", "rt"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
pprof = { version = "0.15", features = ["criterion", "protobuf-codec", "flamegraph"] }

[[bench]]
name = "packets"
harness = false

# Symbols for the profiles.
[profile.bench]
debug = true

# Not a member of a workspace that the crate may be in.
[workspace]
