# The mutants that the job `privileged` of .github/workflows/mutants.yml runs as root,
# with the tests of TUNs, of netlink and of the fast path, which make devices and
# network namespaces and load programs: those that .cargo/mutants.toml leaves out of
# the shards for them. Here, as root, with the CI's runner:
#
#     CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER=sudo \
#       cargo mutants --config .cargo/mutants-privileged.toml -j 1 -- \
#       --lib --bins --test tun_linux ... -- --include-ignored
#
# One mutant at a time: the tests share the names of their namespaces.

all_features = true

examine_re = [
    # The TUN device, its routes, netlink and the loader of the eBPF fast path.
    '^src/(tun|netlink|ebpf)\.rs:',
    '^src/tun/[a-z_]+\.rs:',
    # The code of TUNs and of the fast path in the files that the shards mutate, the
    # program's TUN, and the sends that wait for room in the socket's buffer: the
    # regexes by which .cargo/mutants.toml leaves them out.
    'src/bin/oxirush-upf-sim\.rs:152:5: replace attach_tun ',
    'src/endpoint/routes\.rs:(49|80|286|338|350|361):[0-9]+: replace ',
    'src/endpoint/routes\.rs:266:70: replace != with == in RouteTable::install_with_teid$',
    'src/endpoint\.rs:(280|622|623|670|972|1017|1078):[0-9]+: (replace|delete) ',
    'src/endpoint\.rs:1008:5: replace forward_tun with \(\)$',
    'src/upf_sim\.rs:(277|281|296|398|435|453|519|672|676|704):[0-9]+: (replace|delete) ',
    'src/upf_sim/sessions\.rs:(57|237|255|257):[0-9]+: (replace|delete) ',
]

# Mutants that no test can tell from the code, each with why.
exclude_re = [
    # Flags of distinct bits, and bits of distinct places: `^` joins them as `|`
    # does. The request and acknowledgement flags of netlink and the flags of a
    # request, which are never those; NLM_F_CREATE and NLM_F_EXCL; the flags of a
    # TUN; O_NONBLOCK with the flags of a descriptor that this module opened
    # without it; each CPU's bit of an RPS mask; SOCK_DGRAM and SOCK_CLOEXEC.
    'src/netlink\.rs:(115:38|115:50|264:26|289:26|356:26|385:26|392:26): replace \| with \^ ',
    'src/tun/device\.rs:(27:28|27:46|84:68): replace \| with \^ ',
    'src/ebpf\.rs:(929:22: replace \| with \^ in rps_mask|969:67: replace \| with \^ in disable_tx_checksum)$',
    # An IPv4 address that a link lacks is added without NLM_F_CREATE, and one
    # that it has is refused with EEXIST without NLM_F_REPLACE, with NLM_F_EXCL
    # or not.
    'src/netlink\.rs:356:26: replace \| with & in Netlink::add_address$',
    # The kernel answers each request of this module with datagrams of one
    # message, the answer and then the acknowledgement: a message ends where its
    # datagram does, and the loop over the messages of a datagram ends after it
    # whatever the length that the mutant reads.
    'src/netlink\.rs:143:(60: replace \+ with \*|65: replace & with [|^]) in Netlink::exchange$',
    'src/netlink\.rs:144:(27: replace == with !=|32: replace \|\| with &&|42: replace >= with <) in Netlink::exchange$',
    # Likewise the last message of an announcement ends where its datagram does:
    # the loop ends after it without the break.
    'src/netlink\.rs:458:24: replace \|\| with && in link_mtus$',
    # A request for the link of an index fails with ENODEV alone, when it has none.
    'src/netlink\.rs:209:27: replace match guard error\.raw_os_error\(\) == Some\(libc::ENODEV\) with true in Netlink::name_of$',
    # A write to a TUN takes the whole packet or fails; fcntl on a descriptor
    # that is open does not fail, and gives flags of O_RDWR at least, and
    # F_SETFL 0.
    'src/tun/device\.rs:68:36: replace match guard written == packet\.len\(\) with true in TunDevice::send$',
    'src/tun/device\.rs:80:14: replace < with (<=|==) in set_nonblocking$',
    'src/tun/device\.rs:84:90: replace < with > in set_nonblocking$',
    # Likewise a UDP socket of the stage's ioctl, which is not descriptor 0, the
    # standard input; and the ioctl, which gives 0, on a veth, which has the
    # offload to turn off.
    'src/ebpf\.rs:970:19: replace < with (<=|==) in disable_tx_checksum$',
    'src/ebpf\.rs:976:78: replace < with > in disable_tx_checksum$',
    # A kernel with IPv6, as each runner's, turns the IPv6 addresses of a TUN or
    # of the stage off: the call does not fail with the errors of a kernel
    # without it, or with any other.
    'src/ebpf\.rs:362:24: (delete ! |replace match guard .* with (true|false) )in FastPath::load$',
    'src/tun/routing\.rs:124:20: (delete ! |replace match guard .* with (true|false) )in RoutingLease::configure$',
    # A tunnel short-cut again through the TUN that has its short-cut: the
    # mutant ends it first, and makes the same maps again.
    'src/ebpf\.rs:665:26: replace match guard other != tun with true in State::write$',
    # A second error of the announcements' socket exactly one second after the
    # first, to the nanosecond.
    'src/ebpf\.rs:773:65: replace < with <= in follow_mtus$',
    # A TUN's reader that asks for the short-cut that its TUN has, or before the
    # time to ask again: the same short-cut is made again.
    'src/endpoint\.rs:1017:32: replace && with \|\| in forward_tun$',
    # A link removed by another between the check of its name and its removal.
    'src/tun/routing\.rs:80:23: replace match guard error\.raw_os_error\(\) == Some\(libc::ENODEV\) with false in remove_link$',
]
