# What cargo-mutants 27.1.0 (https://mutants.rs) changes in the crate, and what it
# leaves alone. .github/workflows/mutants.yml runs every mutant in shards; here, a
# file or a function at a time:
#
#     cargo mutants -f src/extension.rs
#
# The CI of the crate is the same build without debug information
# (CARGO_PROFILE_DEV_DEBUG=0), which builds and links each mutant faster. The eBPF
# programs of src/ebpf/programs.rs are no module of the crate: ebpf/build.sh builds
# them into the committed object, which the crate loads.

# Every feature, so that the code of `tun` and `ebpf` is in the build
# that the tests run on: without its feature, a mutant of that code would build
# without it and pass.
all_features = true

# The TUN device, its routes, netlink and the loader of the eBPF fast path: the tests
# that see what they do run as root, in network namespaces, which `cargo test` does
# not. The job `privileged` of .github/workflows/mutants.yml runs these mutants with
# them, as .cargo/mutants-privileged.toml says.
exclude_globs = ["src/tun.rs", "src/tun/*.rs", "src/netlink.rs", "src/ebpf.rs"]

exclude_re = [
    # The code of TUNs in the files that the shards mutate: the job `privileged`
    # runs these mutants, as root, by the same regexes in
    # .cargo/mutants-privileged.toml. (What the UPF does without a TUN is built
    # without the feature `tun`: the job `without-tun` runs it.)
    'src/endpoint\.rs:.*(: replace (Endpoint::attach_tun|forward_tun) | in (Endpoint::attach_tun|forward_tun)$)',
    'src/endpoint\.rs:.*: (replace match guard !packet\.payload\.is_empty\(\) with (true|false)|delete !) in receive$',
    'src/endpoint/routes\.rs:.*(TunAttachment>::drop|RouteTable::(close_tuns|tun_slot|attach_tun|tun) |Routes::tun_slot)',
    'src/upf_sim\.rs:.*(TunAttachment>::drop|Sessions::tun |UpfSimulator::attach_tun|: replace (tun_slot|forward_tun_downlink) | in (write_to_tun|forward_tun_downlink|tun_slot)$|replace write_to_tun -> bool with false$)',

    # Mutants that no test can tell from the code, each with why.
    #
    # Flags of distinct bits of one octet, and the QFI of 6 bits that check_qfi keeps
    # under them: `^` joins them as `|` does. The flags of the first octet of new IEs
    # of a later release are kept out of those that this release knows. Likewise the
    # flags of the PDU Session Container and the PPI of 3 bits above them, the flags
    # of the PDU Set Information and the QFI above the 2 high bits of its PSSN of 10,
    # and the E, S and PN flags of the header.
    'src/extension\.rs:.*: replace \| with \^ in (UplinkPduSessionInformation::encode|DownlinkPduSessionInformation::encode)$',
    'src/pdu_set\.rs:.*: replace \| with \^ in DownlinkPduSetInformation::encode$',
    'src/packet\.rs:.*: replace \| with \^ in (decode|Packet<P>::encode_into)$',
    # Whether the unknown new IEs end the container at a multiple of 4 octets:
    # two octets more or two fewer are four apart. Named by its column, as the
    # function has a mutant of the same name.
    'src/extension\.rs:\d+:40: replace \+ with - in UplinkPduSessionInformation::encode$',
    # The end of a receive task that is neither its return nor its abort is a panic,
    # which no input makes it do.
    'src/(endpoint|upf_sim)\.rs:.*: replace match guard error\.is_cancelled\(\) with true in (Endpoint|UpfSimulator)::shutdown$',
    # What the fuzz targets take from the inside of the crate, the module `fuzzing` and
    # the reply of the path without a socket, is built with `--cfg fuzzing` alone: the
    # build that the tests run on has none of it, and every mutant of it passes.
    'src/lib\.rs:.*: replace fuzzing::(answer|length_error_response|echo_reply) -> ',
    'src/path\.rs:.*(: replace reply -> | in reply$)',
]
