name: Mutants

# The mutation testing of the crate: the jobs of crate-mutants.yml of oxirush-aper,
# which every crate of the family calls, here with 4 shards, and the mutants of TUN,
# netlink and eBPF and of the code built without TUN after them. The workflow is run by
# hand before a release: with `full`, every mutant; without it, the mutants of the code
# that the commits since the last run changed, and none without such a commit; with
# `recheck`, the mutants that a file of the repository names, as a missed.txt has them,
# again at the head. .cargo/mutants.toml says what it leaves alone, and why.
on:
  workflow_dispatch:
    inputs:
      full:
        description: Every mutant, rather than those of the changes since the last run
        type: boolean
        default: false
      parallel:
        description: The shards of each job that run at once, rather than one
        type: string
        default: ""
      recheck:
        description: A file of the repository that names mutants, one a line, to run again at the head
        type: string
        default: ""

# A run is never cancelled by another: a newer one waits until it ends.
concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: false

# The plan reads the runs of the workflow, to find where the last one ended.
permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Without debug information each mutant builds and links faster.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  mutants:
    uses: linouxis9/oxirush-aper/.github/workflows/crate-mutants.yml@7ff6f4df878d24cb90b62059144e728ca30beac2
    with:
      shards: 4
      full: ${{ inputs.full }}
      parallel: ${{ inputs.parallel }}
      recheck: ${{ inputs.recheck }}

  # After the shards, the TUN device, its routes, netlink and the loader of the eBPF
  # fast path, the code of TUNs and of the fast path in the other files, and the sends
  # that wait for room in the socket's buffer, which .cargo/mutants.toml leaves to
  # this job and .cargo/mutants-privileged.toml names: the tests that see what they
  # do create devices and namespaces, add qdiscs and load programs, as root, as the
  # job `tun` of the CI runs them. Every test runs but those of Wireshark. One mutant
  # at a time, for the tests share the names of their namespaces.
  privileged:
    name: Mutants of TUN, netlink and eBPF (shard ${{ matrix.shard }} of 2, root)
    needs: mutants
    if: always() && needs.mutants.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel || '1') }}
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      # The tests of the job `tun` of the CI, and those of the library, with the ignored
      # ones; the four that use a VRF are skipped without its module, as there.
      - name: Load the vrf module
        id: vrf
        run: |
          sudo apt-get update
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
          if sudo modprobe vrf; then
            echo "skip=" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no vrf kernel module: the VRF tests are skipped"
            echo "skip=--skip ue_vrf --skip carried_in_the_kernel --skip handover --skip first_short_cut --skip another_port" >> "$GITHUB_OUTPUT"
          fi
      - run: |
          cargo mutants --config .cargo/mutants-privileged.toml -j 1 \
            --shard ${{ matrix.shard }}/2 --sharding round-robin \
            -- --lib --bins --test codec_properties --test endpoint --test paths \
            --test peer_limits --test upf_sim --test tun_linux --test tun_cleanup \
            --test ebpf_linux \
            -- --include-ignored ${{ steps.vrf.outputs.skip }} || [ $? -eq 3 ]
          test ! -s mutants.out/missed.txt
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants.out-privileged-${{ matrix.shard }}
          path: mutants.out

  # After the shards, what a build without the feature `tun` does where that of every
  # feature has a TUN: the UPF's write to none.
  without-tun:
    name: Mutants of the code built without TUN
    needs: mutants
    if: always() && needs.mutants.outputs.mode == 'full'
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: prlimit --as=4294967296
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - run: |
          cargo mutants --no-config -j 2 \
            -f src/upf_sim.rs \
            -F 'src/upf_sim\.rs:.*: replace write_to_tun -> bool with true$' \
            || [ $? -eq 3 ]
          test ! -s mutants.out/missed.txt
          test -s mutants.out/caught.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants.out-without-tun
          path: mutants.out
