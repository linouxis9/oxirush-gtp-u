name: Mutants

# cargo-mutants changes the code of the crate at one place at a time, a mutant, and runs
# the tests on each: a mutant that every test passes is code that no test checks.
# .cargo/mutants.toml says what it leaves alone, and why. Every mutant runs each Sunday,
# the day of the week without fuzzing, and when the run is started by hand with `full`;
# on the other nights after a day with a commit, and when it is started by hand without
# `full`, the mutants of the code that the commits of the last day changed; started by
# hand with `recheck`, the mutants that a file of the repository names, as a missed.txt
# has them, again at the head. Each job keeps its mutants.out, with the commit that it
# ran at, and a missed mutant fails it. The crates of the family start at times of their
# own, and few jobs of each run at once, to leave runners to the other CI: one shard at
# a time, unless `parallel`, by hand, says how many. A shard takes every n-th mutant, so
# that the shards of a job last alike, and they are as many as keep each to 2 hours or
# less.
on:
  schedule:
    - cron: "13 6 * * 0"
    - cron: "43 1 * * 1-6"
  workflow_dispatch:
    inputs:
      full:
        description: Every mutant, rather than those of the last day's changes
        type: boolean
        default: false
      parallel:
        description: The shards of each job that run at once, rather than the weekly number
        type: string
        default: ""
      recheck:
        description: A file of the repository that names mutants, one a line, to run again at the head
        type: string
        default: ""

# A run is never cancelled by another: a newer one waits until it ends.
concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: false

# The plan reads the runs of the workflow, to find where the last one ended.
permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Without debug information each mutant builds and links faster.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # What the run mutates: every mutant, the mutants of what the commits of the last day
  # changed since the last commit before them, or nothing after a day without a commit.
  plan:
    name: What to mutate
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      base: ${{ steps.plan.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          WEEKLY: "13 6 * * 0"
          SCHEDULE: ${{ github.event.schedule }}
          FULL: ${{ inputs.full }}
          RECHECK: ${{ inputs.recheck }}
        run: |
          # The head of the last run of this workflow on this branch that ended after its
          # plan, or the empty tree: the commits after it are the ones to mutate, however
          # late a run starts and however old the date of a commit is. A run whose plan
          # succeeded and whose shards then failed, for a missed mutant as for a lost runner
          # or a shard that ended early, is such a base too, and no later run mutates its
          # commits again: it stays red until someone reads it, and is run again itself. A
          # run of `recheck`, which mutates named mutants alone, is none.
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow mutants.yml \
            --branch "$GITHUB_REF_NAME" --status completed --limit 100 \
            --json databaseId,conclusion \
            --jq '.[] | select(.conclusion == "success" or .conclusion == "failure") | .databaseId')
          base=
          for run in $runs; do
            base=$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json headSha,jobs --jq '
              select(any(.jobs[]; .name == "What to mutate" and .conclusion == "success")
                and all(.jobs[]; (.name | startswith("Mutants named by the file") | not)
                  or .conclusion == "skipped"))
              | .headSha')
            if [ -n "$base" ]; then break; fi
          done
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git hash-object -t tree /dev/null)
          fi
          if [ -n "$RECHECK" ]; then
            mode=recheck
          elif [ "$SCHEDULE" = "$WEEKLY" ] || [ "$FULL" = true ]; then
            mode=full
          elif [ "$base" != "$(git rev-parse HEAD)" ]; then
            mode=diff
          else
            mode=none
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

  # The lines that no test reaches: the summary of each file in the log, and each line
  # in the report that the job keeps (cargo-llvm-cov 0.9.1): once in each run that
  # mutates something. The tests of TUN and of the fast path, which need root, are not
  # among them.
  coverage:
    name: Coverage
    needs: plan
    if: needs.plan.outputs.mode != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo llvm-cov --locked --all-features --html
      - run: cargo llvm-cov report --summary-only
      - run: cargo llvm-cov report --lcov --output-path target/llvm-cov/lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            target/llvm-cov/html
            target/llvm-cov/lcov.info

  mutants:
    name: Mutants (shard ${{ matrix.shard }} of 4)
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    env:
      # A test of a mutant that allocates without end fails once it has 4 GiB of
      # address space, instead of taking the memory of the runner, which then dies.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: prlimit --as=4294967296
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel || '1') }}
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      # cargo-mutants exits with 3 when a mutant made a test run until its timeout,
      # before it says whether a mutant was missed: a mutant that makes a test loop
      # forever is one that the tests see, and missed.txt has those that they do not.
      - run: |
          cargo mutants --shard ${{ matrix.shard }}/4 --sharding round-robin -j 2 || [ $? -eq 3 ]
          test ! -s mutants.out/missed.txt
      - if: always()
        run: mkdir -p mutants.out && git rev-parse HEAD > mutants.out/commit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants.out-${{ matrix.shard }}
          path: mutants.out

  # The mutants that the file `recheck` names, as a missed.txt has them: each again at the
  # head, in as many shards as every mutant. A name that is no mutant of the head, as one
  # whose line has moved since, is not tried, and fails its shard as one that ends early
  # does (.github/mutants-recheck.py).
  recheck:
    name: Mutants named by the file (shard ${{ matrix.shard }} of 4)
    needs: plan
    if: needs.plan.outputs.mode == 'recheck'
    runs-on: ubuntu-latest
    env:
      # A test of a mutant that allocates without end fails once it has 4 GiB of
      # address space, instead of taking the memory of the runner, which then dies.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: prlimit --as=4294967296
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel || '1') }}
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - env:
          NAMED: ${{ inputs.recheck }}
        run: python3 .github/mutants-recheck.py "$NAMED" ${{ matrix.shard }} 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants.out-recheck-${{ matrix.shard }}
          path: mutants.out

  # The mutants of the lines that the commits of the last day changed.
  changes:
    name: Mutants of the last day's changes
    needs: plan
    if: needs.plan.outputs.mode == 'diff'
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: prlimit --as=4294967296
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - run: |
          git diff ${{ needs.plan.outputs.base }} HEAD > "$RUNNER_TEMP/changes.diff"
          cargo mutants --in-diff "$RUNNER_TEMP/changes.diff" -j 2 || [ $? -eq 3 ]
          test ! -s mutants.out/missed.txt
      - if: always()
        run: mkdir -p mutants.out && git rev-parse HEAD > mutants.out/commit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants.out-changes
          path: mutants.out


  # After the shards, the TUN device, its routes, netlink and the loader of the eBPF
  # fast path, the code of TUNs and of the fast path in the other files, and the sends
  # that wait for room in the socket's buffer, which .cargo/mutants.toml leaves to
  # this job and .cargo/mutants-privileged.toml names: the tests that see what they
  # do create devices and namespaces, add qdiscs and load programs, as root, as the
  # job `tun` of the CI runs them. Every test runs but those of Wireshark. One mutant
  # at a time, for the tests share the names of their namespaces.
  privileged:
    name: Mutants of TUN, netlink and eBPF (shard ${{ matrix.shard }} of 2, root)
    needs: [plan, mutants]
    if: always() && needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel || '1') }}
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      # The tests of the job `tun` of the CI, and those of the library, with the ignored
      # ones; the four that use a VRF are skipped without its module, as there.
      - name: Load the vrf module
        id: vrf
        run: |
          sudo apt-get update
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
          if sudo modprobe vrf; then
            echo "skip=" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no vrf kernel module: the VRF tests are skipped"
            echo "skip=--skip ue_vrf --skip carried_in_the_kernel --skip handover --skip first_short_cut --skip another_port" >> "$GITHUB_OUTPUT"
          fi
      - run: |
          cargo mutants --config .cargo/mutants-privileged.toml -j 1 \
            --shard ${{ matrix.shard }}/2 --sharding round-robin \
            -- --lib --bins --test codec_properties --test endpoint --test paths \
            --test peer_limits --test upf_sim --test tun_linux --test tun_cleanup \
            --test ebpf_linux \
            -- --include-ignored ${{ steps.vrf.outputs.skip }} || [ $? -eq 3 ]
          test ! -s mutants.out/missed.txt
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants.out-privileged-${{ matrix.shard }}
          path: mutants.out

  # After the shards, what a build without the feature `tun` does where that of every
  # feature has a TUN: the program's refusal of one, and the UPF's write to none.
  without-tun:
    name: Mutants of the code built without TUN
    needs: [plan, mutants]
    if: always() && needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: prlimit --as=4294967296
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - run: |
          cargo mutants --no-config --features cli -j 2 \
            -f src/bin/oxirush-upf-sim.rs -f src/upf_sim.rs \
            -F 'src/bin/oxirush-upf-sim\.rs:.*: replace attach_tun ' \
            -F 'src/upf_sim\.rs:.*: replace write_to_tun -> bool with true$' \
            || [ $? -eq 3 ]
          test ! -s mutants.out/missed.txt
          test -s mutants.out/caught.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants.out-without-tun
          path: mutants.out
