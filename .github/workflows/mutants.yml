name: Mutants

# cargo-mutants changes the code of the crate at one place at a time, a mutant, and
# runs the tests on each: a mutant that every test passes is code that no test
# checks. .cargo/mutants.toml says what it leaves alone, and why. The mutants are
# split in shards that run beside each other, each of which keeps its mutants.out;
# a missed mutant fails its shard.
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Without debug information each mutant builds and links faster.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # A night after a day without a commit has no new code to mutate: the scheduled
  # run stops here. A run started by hand always runs.
  changed:
    name: A commit of the last day
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$GITHUB_EVENT_NAME" != schedule ] || [ "$age" -lt 86400 ]; then
            echo run=true >> "$GITHUB_OUTPUT"
          fi

  mutants:
    name: Mutants (shard ${{ matrix.shard }} of 4)
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      # A test of a mutant that allocates without end fails once it has 4 GiB of
      # address space, instead of taking the memory of the runner, which then dies.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: prlimit --as=4294967296
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      # cargo-mutants exits with 3 when a mutant made a test run until its timeout,
      # before it says whether a mutant was missed: a mutant that makes a test loop
      # forever is one that the tests see, and missed.txt has those that they do not.
      - run: |
          cargo mutants --shard ${{ matrix.shard }}/4 -j 2 || [ $? -eq 3 ]
          test ! -s mutants.out/missed.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants.out-${{ matrix.shard }}
          path: mutants.out

  # The TUN device, its routes, netlink and the loader of the eBPF fast path, which
  # .cargo/mutants.toml leaves to this job: the tests that see what they do create
  # devices and namespaces and load programs, as root, as the job `tun` of the CI runs
  # them. One mutant at a time, for the tests share the names of their namespaces.
  privileged:
    name: Mutants of TUN, netlink and eBPF (shard ${{ matrix.shard }} of 2, root)
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      # The tests of the job `tun` of the CI, and those of the library, with the ignored
      # ones; the four that use a VRF are skipped without its module, as there.
      - name: Load the vrf module
        id: vrf
        run: |
          sudo apt-get update
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
          if sudo modprobe vrf; then
            echo "skip=" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no vrf kernel module: the VRF tests are skipped"
            echo "skip=--skip ue_vrf --skip carried_in_the_kernel --skip handover --skip installing_a_tunnel" >> "$GITHUB_OUTPUT"
          fi
      - run: |
          cargo mutants --no-config --all-features -j 1 --shard ${{ matrix.shard }}/2 \
            -f src/tun.rs -f 'src/tun/*.rs' -f src/netlink.rs -f src/ebpf.rs \
            -- --lib --test tun_linux --test tun_cleanup --test ebpf_linux \
            -- --include-ignored ${{ steps.vrf.outputs.skip }} || [ $? -eq 3 ]
          test ! -s mutants.out/missed.txt
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants.out-privileged-${{ matrix.shard }}
          path: mutants.out
