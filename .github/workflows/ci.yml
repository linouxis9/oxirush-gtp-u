name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Each set of features: all, the default (`endpoint`), and none
      - run: cargo test --locked --all-features
      - run: cargo test --locked
      - run: cargo test --locked --no-default-features

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --all-features
      - run: cargo test --locked --no-default-features

  targets:
    name: Other targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu, aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      # 32-bit x86, where aya does not build and `ebpf` adds nothing, and
      # AArch64, where it does.
      - run: cargo check --locked --all-features --all-targets --target i686-unknown-linux-gnu
      - run: cargo check --locked --all-features --all-targets --target aarch64-unknown-linux-gnu

  minimal-versions:
    name: Minimal dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo update -Z direct-minimal-versions
      - run: cargo test --all-features

  tun:
    name: TUN and eBPF fast path (root, network namespaces)
    # Passwordless sudo, and a kernel with TCX (Linux 6.6): the verifier
    # judges the programs here, which no other job loads.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Azure kernels ship the vrf module in linux-modules-extra.
      - name: Load the vrf module
        id: vrf
        run: |
          uname -r
          sudo apt-get update
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
          if sudo modprobe vrf; then
            echo "skip=" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no vrf kernel module: the VRF test is skipped"
            echo "skip=--skip ue_vrf" >> "$GITHUB_OUTPUT"
          fi
      - run: cargo test --locked --features tun --test tun_linux --test tun_cleanup -- --ignored ${{ steps.vrf.outputs.skip }}
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo
      # The fast path loads eBPF programs; three of its tests use a VRF.
      - run: cargo test --locked --features ebpf --test ebpf_linux -- --ignored ${{ steps.vrf.outputs.skip && '--skip carried_in_the_kernel --skip handover --skip installing_a_tunnel' }}
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo
      # What the fast path hears of the links, in a network namespace.
      - run: cargo test --locked --features ebpf --lib -- --ignored
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo

  ebpf-object:
    name: eBPF object matches its source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The nightly toolchain that ebpf/rust-toolchain.toml pins, with rust-src.
      - run: rustup toolchain install
        working-directory: ebpf
      - uses: taiki-e/install-action@v2
        with:
          tool: bpf-linker@0.11.1
      - run: ebpf/build.sh
      # A committed object that its source does not produce fails here.
      - run: git diff --exit-code -- src/ebpf/gtpu.o

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package --locked
      # The published crate has what rebuilds the eBPF object it ships.
      - name: The eBPF build files are in the package
        run: |
          # Outside the checkout: a new file in it would make the tree dirty.
          files="$RUNNER_TEMP/files.txt"
          cargo package --locked --list > "$files"
          for file in build.sh programs.toml programs.lock config.toml rust-toolchain.toml; do
            grep -qx "ebpf/$file" "$files"
          done
          grep -qx src/ebpf/programs.rs "$files"
          grep -qx src/ebpf/layout.rs "$files"
          grep -qx src/ebpf/gtpu.o "$files"

  wireshark:
    name: Wire format against Wireshark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The release's own tshark is older than the tests need: a failed
      # fetch of the PPA is an error, and so is a tshark before 4.4.0, the
      # first whose dissector has every field that the tests read.
      - name: Install tshark 4.4 or later
        run: |
          sudo add-apt-repository -y ppa:wireshark-dev/stable
          sudo apt-get update -o APT::Update::Error-Mode=any
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
          tshark --version | head -n 1
          version=$(tshark --version | head -n 1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          if ! dpkg --compare-versions "$version" ge 4.4.0; then
            echo "::error::tshark $version is older than 4.4.0, which the tests need"
            exit 1
          fi
      - run: cargo test --locked --test wireshark -- --ignored

  fuzz:
    name: Fuzz the decoders (1 minute)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run decode -- -max_total_time=60 -max_len=512

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings

  doc:
    name: Doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: "--cfg docsrs -D warnings"

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo fmt --check --manifest-path fuzz/Cargo.toml
      - run: cargo fmt --check --manifest-path benches/Cargo.toml

  bench:
    name: Benchmarks run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benches
      # Each benchmark once, without timing: the figures of a shared runner
      # say nothing
      - run: cargo test --manifest-path benches/Cargo.toml --benches
      - run: cargo clippy --manifest-path benches/Cargo.toml --all-targets -- -D warnings

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    # The action reports through a check run.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # The blocks of the README that use other crates of the family: `family/` is a
  # package of its own, which takes them at the revisions of its manifest, so that the
  # crate depends on none of them. It compares what each block prints with the README.
  family:
    name: The README blocks with the other crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: family
      - run: cargo test --manifest-path family/Cargo.toml
      - run: cargo clippy --manifest-path family/Cargo.toml --all-targets -- -D warnings
      - run: cargo fmt --check --manifest-path family/Cargo.toml
