# The manifest of the crate that builds src/ebpf/programs.rs for the eBPF
# target. build.sh copies it to build/Cargo.toml: under that name here, cargo
# would leave this directory out of the published crate.
[package]
name = "oxirush-gtp-u-ebpf"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0"

[dependencies]
aya-ebpf = "0.2.1"

[[bin]]
name = "gtpu"
path = "../../src/ebpf/programs.rs"
test = false
doc = false
bench = false

[profile.release]
lto = true
panic = "abort"
codegen-units = 1

# Not part of any parent workspace.
[workspace]
members = ["."]
