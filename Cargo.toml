[package]
name = "oxirush-gtp-u"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "GTP-U for 5G and LTE in Rust (3GPP TS 29.281, TS 38.415): a codec, a Tokio endpoint for the tunnels of a gNB or an eNB, a test UPF, Linux TUN devices and an eBPF fast path."
license = "Apache-2.0"
repository = "https://github.com/linouxis9/oxirush-gtp-u"
documentation = "https://docs.rs/oxirush-gtp-u"
keywords = ["5g", "gtp-u", "upf", "3gpp", "ebpf"]
categories = ["network-programming", "parser-implementations", "development-tools::testing"]
readme = "README.md"
exclude = ["/.github", "/.gitignore", "/benches", "/ebpf/.gitignore", "/family", "/fuzz"]

[features]
default = ["endpoint"]
# The Tokio N3 endpoint and the test UPF.
endpoint = ["dep:tokio", "dep:tracing"]
# Linux TUN devices and their routing, set up over rtnetlink.
tun = [
    "endpoint",
    "dep:libc",
    "dep:netlink-packet-core",
    "dep:netlink-packet-route",
    "dep:netlink-sys",
]
# The eBPF fast path of the endpoint's tunnels (Linux 6.6, and a
# little-endian architecture of aya below).
ebpf = ["tun", "dep:aya"]
# Serialize and Deserialize for RemoteTunnel, which is in endpoint.
serde = ["endpoint", "dep:serde"]
# The oxirush-upf-sim program, which needs Tokio's macros and signals.
cli = ["endpoint", "tokio/macros", "tokio/signal"]

[dependencies]
serde = { version = "1.0.110", features = ["derive"], optional = true }
tokio = { version = "1.38", features = ["net", "rt", "sync", "time"], optional = true }
tracing = { version = "0.1.40", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2.164", optional = true }
netlink-packet-core = { version = "0.9", optional = true }
netlink-packet-route = { version = "0.33", optional = true }
netlink-sys = { version = "0.9", optional = true }

# The architectures that aya-obj 0.3 has the kernel's definitions for,
# little-endian as the programs' object is, as in build.rs: elsewhere, such
# as on 32-bit x86 or s390x, `ebpf` adds nothing.
[target.'cfg(all(target_os = "linux", target_endian = "little", any(target_arch = "aarch64", target_arch = "arm", target_arch = "loongarch64", target_arch = "mips", target_arch = "mips64", target_arch = "powerpc64", target_arch = "riscv64", target_arch = "s390x", target_arch = "x86_64")))'.dependencies]
aya = { version = "0.14", optional = true }

[dev-dependencies]
proptest = "1.5"
tokio = { version = "1.38", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tracing = "0.1.40"

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2.164"

[[bin]]
name = "oxirush-upf-sim"
required-features = ["cli"]

[[example]]
name = "endpoint"
required-features = ["endpoint"]

[[example]]
name = "path"
required-features = ["endpoint"]

[[example]]
name = "tun"
required-features = ["tun"]

[[example]]
name = "fast_path"
required-features = ["ebpf"]

[[test]]
name = "endpoint"
required-features = ["endpoint"]

[[test]]
name = "upf_sim"
required-features = ["endpoint"]

[[test]]
name = "peer_limits"
required-features = ["endpoint"]

[[test]]
name = "paths"
required-features = ["endpoint"]

[[test]]
name = "tun_linux"
required-features = ["tun"]

[[test]]
name = "ebpf_linux"
required-features = ["ebpf"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
